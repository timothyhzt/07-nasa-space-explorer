<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" />
      <label for="endDate">End date</label>
      <input type="date" id="endDate" />
      <button type="button" id="getImagesButton">Get Space Images</button>
    </div>

    <section class="fact-section" aria-labelledby="factHeading">
      <h2 id="factHeading">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal-content">
        <button type="button" id="closeModal" class="close-modal" aria-label="Close image details">&times;</button>
        <img id="modalImage" src="" alt="" />
        <div class="modal-details">
          <h2 id="modalTitle"></h2>
          <p id="modalDate"></p>
          <p id="modalExplanation"></p>
          <a id="modalVideoLink" href="" target="_blank" rel="noopener noreferrer" hidden>Open video on NASA</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js?v=2"></script>
</body>
</html>
