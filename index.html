<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0b3d91" />

  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  

</head>
<body>
  <div id="offline-banner" class="offline-banner hidden">
    You're offline showing your last loaded images.
  </div>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" />
      <label for="endDate">End date</label>
      <input type="date" id="endDate" />
      <button type="button" id="getImagesButton">Get Space Images</button>
    </div>

    <section class="fact-section" aria-labelledby="factHeading">
      <h2 id="factHeading">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal-content">
        <button type="button" id="closeModal" class="close-modal" aria-label="Close image details">&times;</button>
        <img id="modalImage" src="" alt="" />
        <video id="modalVideo" controls playsinline hidden></video>
        <iframe id="modalVideoFrame" title="Space video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen hidden></iframe>
        <div class="modal-details">
          <h2 id="modalTitle"></h2>
          <p id="modalDate"></p>
          <p id="modalExplanation"></p>
          <a id="modalVideoLink" href="" target="_blank" rel="noopener noreferrer" hidden>Open video on NASA</a>
        </div>
      </div>
    </div>
  </div>

  <div id="install-banner" class="install-banner hidden">
    <span>Install this app on your phone!</span>
    <button id="install-yes" class="install-yes">Install</button>
    <button id="install-dismiss" class="install-dismiss">Not now</button>
  </div>
  <script src="js/dateRange.js"></script>
  <script src="js/script.js?v=4"></script>
</body>
</html>
